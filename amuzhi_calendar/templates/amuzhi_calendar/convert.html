{% extends "base.html" %}
{% block content %}
<h1>Convert - {{ date|date:"M j, Y" }} = {{ market }}</h1>
{% if error %}
<p style="color:red">{{ error }}</p>
{% else %}
<p><b>{{ market }}</b> - {{ meaning }}</p>
<p>🌙 Moon: {{ moon }} | 🌊 {{ tide }} | 📅 {{ igbo_month }}</p>
{% endif %}
<p><a href="/amuzhi/">← Back</a></p>
{% endblock %}
