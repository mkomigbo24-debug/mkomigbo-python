<h2>📝 Sign Up - For New Visitors Only</h2>
<p>Create account = Start Earning USD</p>
{% for m in messages %}<p style="color:red">{{ m }}</p>{% endfor %}
<form method="post">{% csrf_token %}
{{ form.as_p }}
<button>Sign Up & Start Earning 🚀</button>
</form>
<p>Already have account? <a href="/accounts/login/{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">🔑 Login Instead</a></p>
