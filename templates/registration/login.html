{% extends "base.html" %}

<h2>Login to MkomIgbo - Earn USD</h2>

{% csrf_token %}
{{ form.as_p }}

<p>Need account? <a href="/accounts/signup/">Sign Up - Earn USD</a></p>
</div>
{% endblock %}
