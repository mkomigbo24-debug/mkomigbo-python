<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Create</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:sans-serif;background:#f6f5f0}.wrap{max-width:700px;margin:20px auto;padding:20px;background:#fff;border-radius:12px} input,select,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px}.btn{background:#0a4a3a;color:#fff;padding:10px 20px;border-radius:20px;border:none}</style></head><body>
<div class="wrap"><h1>Create + Earn USD</h1>
<form method="post">{% csrf_token %}
<p>Title: <input name="title" required></p>
<p>Type: <select name="post_type"><option value="blog">Blog</option><option value="forum">Forum - HIGH PAY</option><option value="thread">Thread</option><option value="reel">Reel</option><option value="podcast">Podcast</option></select></p>
<p>Subject: <input name="subject_name" placeholder="Biafra, History, Religion..."></p>
<p><label><input type="checkbox" name="is_hot_topic"> 🔥 Hot Topic?</label></p>
<p>Body:<br><textarea name="body" required style="height:250px" placeholder="Biafra: My family story..."></textarea></p>
<button class="btn">Publish</button>
</form><p><a href="/community/">← Back</a></p></div></body></html>
