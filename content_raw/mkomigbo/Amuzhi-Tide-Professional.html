<style>
:root{

.amuzhi-wrapper{ font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#fdfbf6; color:#12211b; }

.amuzhi-month{ background:white; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:2rem; overflow:hidden; border:1px solid #0a4a3a0a; }

.amuzhi-table td{ padding:.6rem .75rem; border-bottom:1px solid #0a4a3a06; font-size:13px; }
.tide-high{ background:linear-gradient(180deg,#e6f2f8 0%,#d0e9f5 100%); border-left:3px solid var(--ocean); font-weight:600; color:var(--ocean); }
.tide-low{ background:#f8fafc; border-left:3px solid #94a3b8; }
.market-eke{ background:var(--eke); border:1px solid #c7d2fe; color:#3730a3; padding:2px 8px; border-radius:999px; font-weight:700; font-size:12px; }
.market-orie{ background:var(--orie); border:1px solid #fed7aa; color:#9a3412; padding:2px 8px; border-radius:999px; font-weight:700; font-size:12px; }
.market-afo{ background:var(--afo); border:1px solid #fecaca; color:#7f1d1d; padding:2px 8px; border-radius:999px; font-weight:700; font-size:12px; }
.market-nkwo{ background:var(--nkwo); border:1px solid #bbf7d0; color:#14532d; padding:2px 8px; border-radius:999px; font-weight:700; font-size:12px; }

</style>
{% endblock %}

{% block content %}
<div class="amuzhi-wrapper">
  <div class="amuzhi-header">
    <h1 style="font-family:serif; font-size:48px; line-height:.9;">Amuzhi Calendar {{ year }}</h1>
    <p>13 moons • 4 market days • Tide intelligence for Bonny to Mombasa</p>
    <div style="margin-top:1rem; display:flex; gap:.5rem; flex-wrap:wrap;">
      <span style="background:white; color:var(--emerald); padding:.5rem 1rem; border-radius:999px; font-weight:700; font-size:12px;">{{ months|length }} MONTHS • 365 DAYS</span>
      <span style="background:var(--gold); color:var(--emerald); padding:.5rem 1rem; border-radius:999px; font-weight:700; font-size:12px;">Africa & Beyond 2B</span>
    </div>
  </div>

  {% for month in months %}
  <section class="amuzhi-month">
    <div style="position:sticky; top:0; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); padding:1rem 1.25rem; border-bottom:1px solid #0a4a3a0f; display:flex; justify-content:space-between;">
      <h2 style="font-family:serif; font-size:22px; margin:0;">{{ month.igbo_name }} {% if month.is_alom_chi %}<span style="background:var(--red); color:white; font-size:10px; padding:2px 8px; border-radius:999px; vertical-align:middle;">Ọnwa Alọm Chi • 29 days sacred</span>{% endif %}</h2>
      <span style="font-size:11px; background:#e6f2f8; color:var(--ocean); padding:4px 10px; border-radius:999px; font-weight:700;">{{ month.days.all.0.gregorian_date }} → {{ month.days.all|last.gregorian_date }}</span>
    </div>

    <div style="overflow-x:auto;">
      <table class="amuzhi-table">
        <thead>
          <tr>
            <th>Igbo Day</th><th>Gregorian</th><th>Weekday</th><th>Market</th><th>Moon</th><th>Illum</th>
            <th style="background:#e6f2f8; color:var(--ocean);">▲ High Tide</th>
            <th>▼ Low Tide</th><th>Height</th><th>Location</th><th>Fishermen Advice</th>
          </tr>
        </thead>
        <tbody>
          {% for day in month.days.all %}
          <tr class="{% if day.is_today %}today-row{% endif %}">
            <td><strong>{{ day.igbo_day_number }}</strong> • {{ month.short_name }} {{ day.igbo_day_number }}</td>
            <td>{{ day.gregorian_date|date:"d M Y" }}</td>
            <td><span style="background:#0a4a3a06; padding:2px 8px; border-radius:999px;">{{ day.weekday|slice:":3" }}</span></td>
            <td>
              {% if day.market_day == "Eke" %}<span class="market-eke">Eke</span>
              {% elif day.market_day == "Orie" %}<span class="market-orie">Orie</span>
              {% elif day.market_day == "Afo" %}<span class="market-afo">Afo</span>
              {% else %}<span class="market-nkwo">Nkwo</span>{% endif %}
            </td>
            <td>{{ day.moon_symbol }} {{ day.moon_stage }}</td>
            <td><div style="width:48px; height:6px; background:#0a4a3a10; border-radius:999px; overflow:hidden; display:inline-block; vertical-align:middle;"><div style="height:100%; background:var(--gold); width:{{ day.moon_illumination }}%;"></div></div> {{ day.moon_illumination }}%</td>
            <td class="tide-high">{{ day.high_tide }}</td>
            <td class="tide-low">{{ day.low_tide }}</td>
            <td><span style="background:{% if day.tide_height_m >= 2.4 %}var(--ocean){% elif day.tide_height_m >= 1.8 %}#e6f2f8{% else %}#f1f5f9{% endif %}; color:{% if day.tide_height_m >= 2.4 %}white{% else %}var(--ocean){% endif %}; padding:2px 8px; border-radius:999px; font-weight:700; font-size:12px;">{{ day.tide_height_m }}m</span></td>
            <td>⚓ {{ day.tide_location|default:"Bonny, Rivers" }}</td>
            <td style="max-width:280px; line-height:1.35; color:#334155; font-weight:500;">{{ day.tide_advice }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </section>
  {% endfor %}
</div>
{% endblock %}
