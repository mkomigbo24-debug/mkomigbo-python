{% extends "core/base.html" %}
{% block content %}
<style>
.wrap{max-width:1280px;margin:0 auto;padding:0 5%}
.hero{background:linear-gradient(135deg,#0a4a3a,#2E7D32);color:white;padding:3rem 5%;border-radius:20px;text-align:center;margin:20px 5%}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
@media(max-width:1100px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid5{grid-template-columns:repeat(2,1fr)}}
.card5{background:white;border:2px solid #eef6ee;border-radius:16px;padding:20px;text-align:center;text-decoration:none;color:#0a4a3a;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.card5:hover{border-color:#0a4a3a}
</style>
<div class="hero">
<h1>📚 {{ SITE_NAME }}</h1>
<p>21 Subjects, 121 Pages - Formerly {{ OLD_NAME }} - {{ SITE_TAGLINE }}</p>
</div>
<div class="wrap">
<h2>21 Subjects - 5 Per Row - Not Touching Margins</h2>
<div class="grid5">
{% for subj in subjects %}
<a href="/subjects/{{ subj.slug }}/" class="card5"><b>{{ subj.name }}</b><br><small>{{ subj.pages }} pages</small><br><small style="color:#666">{{ subj.desc }}</small></a>
{% endfor %}
</div>
</div>
{% endblock %}
