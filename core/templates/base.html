<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ SITE_NAME }} - 21 Subjects | Formerly {{ OLD_NAME }}</title>
<style>body{font-family:sans-serif;background:#f6f5f0} header{background:#fff;border-bottom:2px solid #0a4a3a;position:sticky;top:0} .nav{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap} .logo{font-weight:700;color:#0a4a3a;text-decoration:none;margin-right:auto;font-size:1.5rem} .nav a{padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:600} .public-amuzhi{background:#ffd700;color:#000;border:2px solid #000} .public-awag{background:#0a4a3a;color:#fff} main{max-width:1000px;margin:30px auto;padding:20px;background:#fff;border-radius:12px}</style>
</head>
<body>
<header><nav class="nav">
<a href="/" class="logo">{{ SITE_NAME }} <span style="font-size:0.6em">(formerly {{ OLD_NAME }})</span></a>
<a href="/amuzhi/" class="public-amuzhi">Amuzhi</a>
<a href="/awag/" class="public-awag">AWAG</a>
<a href="/community/" style="background:#eee;color:#333">Community</a>
</nav></header>
<main>
{% block content %}{% endblock %}
<div style="background:#fff8e1;padding:15px;border:2px solid #0a4a3a;border-radius:12px;margin:20px 0">
<h3>Observation?</h3>
<form method="post" action="/observation/add/">{% csrf_token %}
<textarea name="text" required style="width:100%;height:80px" placeholder="Correction for {{ OLD_NAME }} to {{ SITE_NAME }}"></textarea><br>
<button style="background:#0a4a3a;color:white;padding:10px;border-radius:20px;width:100%">Send</button>
</form>
</div>
</main>
<footer style="text-align:center;padding:20px;color:#666">{{ SITE_NAME }} (formerly {{ OLD_NAME }}) - {{ SITE_TAGLINE }}</footer>
</body>
</html>
